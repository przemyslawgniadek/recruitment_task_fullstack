# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # NBP API Configuration (from environment variables)
    nbp.api.base_url: '%env(NBP_BASE_URL)%'
    nbp.api.timeout: '%env(int:NBP_TIMEOUT)%'
    nbp.api.retry_attempts: '%env(int:NBP_RETRY_ATTEMPTS)%'
    
    # Supported Currency Codes
    supported.currency.codes: '%env(csv:SUPPORTED_CODES)%'
    
    # Timezone Configuration
    app.timezone: '%env(TIMEZONE)%'
    
    # Cache Configuration (from environment variables)
    cache.fx_rates.ttl: '%env(int:CACHE_FX_RATES_TTL)%'      # 24 hours
    cache.nbp_api.ttl: '%env(int:CACHE_NBP_API_TTL)%'        # 1 hour
    cache.app_metadata.ttl: '%env(int:CACHE_APP_METADATA_TTL)%' # 1 week

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically inject dependencies in your services.
        autoconfigure: true # Automatically register your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Domain Services
    App\Domain\QuotingRules\QuotingRulesService:
        # Stateless service - can be shared
        shared: true

    # Infrastructure Services
    App\Infrastructure\Nbp\NbpHttpClient:
        # Uses default constructor with no arguments

    # Repository Services
    App\Infrastructure\Nbp\NbpRateRepository:
        arguments:
            $nbpClient: '@App\Infrastructure\Nbp\NbpHttpClient'
            $quotingRules: '@App\Domain\QuotingRules\QuotingRulesService'

    # Cache Services
    App\Infrastructure\Cache\CacheKeyGenerator:
        # Stateless service for generating cache keys
        shared: true

    App\Infrastructure\Cache\CacheWarmer:
        arguments:
            $repository: '@App\Domain\Rate\RateRepository'
            $logger: '@logger'

    # Cached Repository Decorator
    App\Infrastructure\Cache\CachedRateRepository:
        arguments:
            $decoratedRepository: '@App\Infrastructure\Nbp\NbpRateRepository'
            $cache: '@cache.fx_rates'
            $keyGenerator: '@App\Infrastructure\Cache\CacheKeyGenerator'
            $logger: '@logger'
        # This will be the primary repository used by controllers
        public: true

    # Primary Repository Alias
    # Controllers will use this alias to get the cached repository
    App\Domain\Rate\RateRepository: 
        alias: 'App\Infrastructure\Cache\CachedRateRepository'
        public: true

    # Cache Services are configured in cache.yaml

    # Timezone Service
    App\Service\TimezoneService:
        arguments:
            $timezone: '%app.timezone%'

    # API Exception Handling
    App\EventListener\ApiExceptionListener:
        arguments:
            $logger: '@logger'
            $environment: '%kernel.environment%'
        tags:
            - { name: kernel.event_listener, event: kernel.exception }