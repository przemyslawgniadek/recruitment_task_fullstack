# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # NBP API Configuration
    nbp.api.base_url: 'https://api.nbp.pl/api'
    nbp.api.timeout: 10
    nbp.api.retry_attempts: 3
    
    # Cache Configuration
    cache.fx_rates.ttl: 86400      # 24 hours
    cache.nbp_api.ttl: 3600        # 1 hour
    cache.app_metadata.ttl: 604800 # 1 week

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically inject dependencies in your services.
        autoconfigure: true # Automatically register your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Domain Services
    App\Domain\QuotingRules\QuotingRulesService:
        # Stateless service - can be shared
        shared: true

    # Infrastructure Services
    App\Infrastructure\Nbp\NbpHttpClient:
        arguments:
            $baseUrl: '%nbp.api.base_url%'
            $timeout: '%nbp.api.timeout%'
            $retryAttempts: '%nbp.api.retry_attempts%'

    # Repository Services
    App\Infrastructure\Nbp\NbpRateRepository:
        arguments:
            $nbpClient: '@App\Infrastructure\Nbp\NbpHttpClient'
            $quotingRulesService: '@App\Domain\QuotingRules\QuotingRulesService'

    # Cache Services
    App\Infrastructure\Cache\CacheKeyGenerator:
        # Stateless service for generating cache keys
        shared: true

    App\Infrastructure\Cache\CacheWarmer:
        arguments:
            $repository: '@App\Domain\Rate\RateRepository'
            $logger: '@logger'

    # Cached Repository Decorator
    App\Infrastructure\Cache\CachedRateRepository:
        arguments:
            $decoratedRepository: '@App\Infrastructure\Nbp\NbpRateRepository'
            $cache: '@cache.fx_rates'
            $keyGenerator: '@App\Infrastructure\Cache\CacheKeyGenerator'
            $logger: '@logger'
        # This will be the primary repository used by controllers
        public: true

    # Primary Repository Alias
    # Controllers will use this alias to get the cached repository
    App\Domain\Rate\RateRepository: '@App\Infrastructure\Cache\CachedRateRepository'

    # Cache Services
    cache.fx_rates:
        parent: cache.app
        tags:
            - { name: 'cache.pool', provider: 'cache.fx_rates' }

    cache.nbp_api:
        parent: cache.app  
        tags:
            - { name: 'cache.pool', provider: 'cache.nbp_api' }

    cache.app_metadata:
        parent: cache.app
        tags:
            - { name: 'cache.pool', provider: 'cache.app_metadata' }